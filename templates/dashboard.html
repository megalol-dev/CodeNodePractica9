<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - WoW Auth</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>

<body class="fondo-auth">

    <header>
        <h1>WOW</h1>
    </header>

    <nav class="dashboard-nav">
        <span>Bienvenido {{ session["usuario_nombre"] }}</span>
        <a href="/logout">Cerrar sesión</a>
    </nav>

    <main class="dashboard-main">

        <section class="user-card">
            <h2>Datos del usuario</h2>
            <p><strong>Email:</strong> {{ session["usuario_email"] }}</p>
        </section>

    </main>

    <footer>
        <p>Reino de Azeroth · Soporte: soporte@wowauth.fake · 2026</p>
    </footer>

</body>

</html>
